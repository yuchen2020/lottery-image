name: Generate Lottery Image
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run script
        run: python lottery_gen.py

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 只有文件存在才 add，避免报错
          if [ -f lottery_result.png ]; then
            git add lottery_result.png
            # 只有改动才 commit
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update image" && git push)
          else
            echo "lottery_result.png 不存在，跳过提交"
          fi
