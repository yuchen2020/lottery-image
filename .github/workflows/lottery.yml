name: Lottery Image Auto Update

on:
  schedule:
    # 北京时间每天21:30 = UTC 13:30
    - cron: '30 13 * * *'
  workflow_dispatch:   # 允许手动触发

# 我加的 —— 解决权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 安装中文字体
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei

    - name: 安装 Python 依赖
      run: |
        pip install requests Pillow urllib3

    - name: 生成彩票图片
      run: python lottery_gen.py

    # 我加的 —— 解决找不到文件
    - name: 确保图片文件存在
      run: touch lottery_result.png

    - name: 提交图片到仓库
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add lottery_result.png
        git commit -m "🔄 自动更新开奖图片 $(date +'%Y-%m-%d %H:%M')" || echo "没有变化"
        git push
