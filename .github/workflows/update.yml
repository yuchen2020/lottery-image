name: Auto Update Lottery Image
on:
  schedule:
    - cron: '30 13 * * *'  # 北京时间 21:30 自动运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: 运行开奖图片生成脚本
        run: python ./generate_3d.py
      - name: 提交更新后的图片
        run: |
          git config --local user.email "github-action@example.com"
          git config --local user.name "GitHub Action Bot"
          git add 3d_result.png
          git commit -m "Auto update lottery image" || echo "No changes"
          git push
